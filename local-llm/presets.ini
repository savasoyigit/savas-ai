; llama-server router preset'leri (C-8.1). Öncelik: komut satırı > model bölümü > [*].
version = 1

[*]
ctx-size = 16384
parallel = 1
cache-ram = 1024
sleep-idle-seconds = 600
threads = 5
; CPU'da düşünme token'ları süreyi katlar; varsayılan kapalı.
reasoning-budget = 0

; gpt-oss düşünmeden çalışmaz: bütçe serbest, efor düşük.
[gpt-oss-20b-Q4_K_M]
model = /models/gpt-oss-20b-Q4_K_M.gguf
reasoning-budget = -1
chat-template-kwargs = {"reasoning_effort":"low"}
